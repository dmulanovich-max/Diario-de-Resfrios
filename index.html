<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=apple-mobile-web-app-capable content=yes><link rel=manifest href=manifest.json><title>Diario de Resfríos</title><style>
:root{--bg:#fff;--line:#e6e2de;--accent:#e94b35;--cold:#e94b35;--sym:#8b6852;--pain:#df8c3e;--act:#6fb9e3;--rest:#d4ad24;--amg:#2cab55}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#303030}header{position:sticky;top:0;background:#fffffff5;padding:18px 16px 10px;border-bottom:1px solid var(--line);z-index:3}h1{font-size:22px;margin:0}.sub,.small{font-size:12px;color:#777}nav{display:flex;gap:8px;margin-top:12px}nav button{flex:1;border:0;border-radius:12px;padding:10px;background:#f1f3f4;font-weight:600}nav .active{background:var(--accent);color:#3b332e}main{padding:16px;max-width:760px;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.title{display:block;font-weight:700;margin-bottom:8px}input[type=date],input[type=text],textarea,select{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.item{padding:11px 0;border-bottom:1px solid var(--line)}.name{font-weight:600;margin-bottom:7px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.lvl{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 2px;font-size:12px}.lvl.active{background:var(--accent);color:#3b332e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:11px}.check input{width:20px;height:20px}.save,.secondary{width:100%;padding:13px;border-radius:13px;font-weight:700}.save{border:0;background:var(--accent);color:#3b332e;font-size:17px}.secondary{border:1px solid var(--line);background:white}.hidden{display:none}.calendar-head{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.dow,.day{text-align:center}.dow{font-size:12px;color:#777}.day{height:112px;min-height:112px;border:1px solid var(--line);border-radius:12px;background:white;padding:6px}.empty{visibility:hidden}.dots{display:flex;flex-direction:column!important;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:4px;margin-top:6px;min-height:68px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.brown{background:#805b45}.blue{background:#2877c7}.red{background:#c63e3e}.green{background:#3b8f5a}.yellow{background:#f2cf00}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px}.legend span{display:flex;gap:5px;align-items:center}.status{text-align:center;color:#777;margin-top:8px;font-size:13px}.entry{padding:9px 0;border-bottom:1px solid var(--line)}.soft{padding:0;overflow:hidden}.section-title{padding:12px 16px;font-weight:750}.section-body{padding:14px 16px 16px}.cold-card .section-title{background:#ef7f63}.sym-card .section-title{background:#df68aa}.pain-card .section-title{background:#f3a653}.act-card .section-title{background:#78bfe2}.rest-card .section-title{background:#ecd45e}.amg-card .section-title{background:#74bd88}.cold-check{display:flex;align-items:center;gap:10px;border:1px solid #e75b3a;border-radius:12px;padding:12px;background:#fff0ec;font-weight:700}.cold-check input{width:22px;height:22px;accent-color:#ef806f}.sym-card .lvl{background:#fde5f3;border-color:#f39bcf}.sym-card .lvl.active{background:#ef70b9!important;border-color:#e6008d!important;color:#4a1635!important}
.pain-card .lvl{background:#fff0df;border-color:#ffbd7a}.pain-card .lvl.active{background:#ffad5c!important;border-color:#ff7900!important;color:#4b2a0a!important}
.act-card .check{background:#eaf6fc;border-color:#acd8ee}.act-card .check input{accent-color:#67bde5}
.rest-card .check{background:#fff9df;border-color:#eadb8c}.rest-card .check input{accent-color:#dfc34b}
.amg-card .check{background:#eaf7ee;border-color:#a8d5b4}.amg-card .check input{accent-color:#6bc182}.dot.coldbig{width:10px;height:10px;background:#e94b35}.orange{background:var(--pain)}.lightblue{background:var(--act)}.amggreen{background:#2cab55}
</style></head><body><header><h1>Diario de Resfríos</h1><div class=sub>Resfríos, síntomas, Amgevita, actividad y dolores</div><nav><button id=tR class=active>Hoy</button><button id=tC>Calendario</button><button id=tD>Datos</button></nav></header><main>
<section id=R><div class=card><label class=title>Fecha</label><input id=fecha type=date></div><div class="card soft cold-card"><div class=section-title>Resfrío declarado</div><div class=section-body><label class=cold-check><input id=resfrio_declarado type=checkbox>Resfrío declarado</label></div></div><div class="card soft sym-card"><div class=section-title>Síntomas</div><div class=section-body><div class=small>0 Nada · 1 Leve · 2 Moderado · 3 Fuerte</div><div id=sym></div></div></div><div class=card><label class=title>Intensidad general</label><select id=general><option value=0>0 — Sin síntomas</option><option value=1>1 — Muy leve</option><option value=2>2 — Leve</option><option value=3>3 — Moderado</option><option value=4>4 — Fuerte</option><option value=5>5 — Muy fuerte</option></select></div>
<div class="card soft pain-card"><div class=section-title>Dolores / lesiones</div><div class=section-body><div id=pain></div><input id=otroDolor type=text placeholder="Si marcaste Otro, escribe cuál"></div></div>
<div class="card soft act-card"><div class=section-title>Actividad</div><div class=section-body><div class=grid id=acts></div><input id=otroAct type=text placeholder="Otra actividad (opcional)" style="margin-top:9px"></div></div><div class="card soft rest-card"><div class=section-title>Descanso</div><div class=section-body><div class=grid><label class=check><input id=descanso type=checkbox>Día de descanso</label><label class=check><input id=siesta type=checkbox>Siesta</label><label class=check><input id=descanso_malestar type=checkbox>Descanso por resfrío o dolor</label></div></div></div>
<div class="card soft amg-card"><div class=section-title>Amgevita</div><div class=section-body><label class=check><input id=amgevita type=checkbox>Aplicación de Amgevita hoy</label></div></div><div class=card><label class=title>Circunstancias</label><div class=grid><label class=check><input id=frio type=checkbox>Frío / traje mojado</label></div></div>
<div class=card><label class=title>Posible exposición</label><input id=expo type=text placeholder="Ej. reunión, mucha gente, viaje..."></div><div class=card><label class=title>Medicinas</label><textarea id=med rows=4 style="min-height:110px;resize:vertical"></textarea></div><div class=card><label class=title>Médico</label><input id=doc type=text></div><div class=card><label class=title>Observaciones</label><textarea id=obs></textarea></div><button id=save class=save>Guardar día</button><div id=status class=status></div></section>
<section id=C class=hidden><div class=card><div class=calendar-head><button id=prev class=secondary style="width:auto">←</button><strong id=month></strong><button id=next class=secondary style="width:auto">→</button></div><div id=cal class=calendar><div class=dow>L</div><div class=dow>M</div><div class=dow>X</div><div class=dow>J</div><div class=dow>V</div><div class=dow>S</div><div class=dow>D</div></div><div class=legend id=calLegend><span data-filter=declared><i class="dot coldbig"></i>Resfrío declarado</span><span data-filter=symptoms><i class="dot brown"></i>Síntomas</span><span data-filter=pain><i class="dot orange"></i>Dolor / lesión</span><span data-filter=activity><i class="dot lightblue"></i>Actividad física</span><span data-filter=rest><i class="dot yellow"></i>Descanso</span><span data-filter=amgevita><i class="dot amggreen"></i>Amgevita</span></div><p class=small>Toca un día para abrirlo.</p></div></section>
<section id=D class=hidden><div class=card><label class=title>Exportar</label><button id=export class=secondary>Exportar CSV</button></div><div class=card><label class=title>Registros guardados</label><div id=list></div></div></section></main><script>
const SYM=["Dolor de cuerpo", "Cansancio", "Sueño", "Dolor de cabeza", "Pesadez/congestión de cabeza", "Congestión nasal", "Dolor de oído", "Mucosidad", "Tos", "Picazón de pecho", "Dolor de garganta", "Crujido bronquial", "Sensación de frío", "Fiebre", "Molestias estomacales"],PAIN=["Cuádriceps", "Sacroilíaco", "Espalda", "Hombro", "Otro"],ACT=["Surf","Natación","Caminata","Entrenamiento","Fisioterapia"],$=x=>document.getElementById(x);
function scale(parent,n,kind){let w=document.createElement("div");w.className="item";w.innerHTML=`<div class=name>${n}</div><div class=levels data-kind="${kind}" data-name="${n}">${[0,1,2,3].map((v,i)=>`<button type=button class="lvl ${i?"":"active"}" data-v=${v}>${v} ${["Nada","Leve","Moderado","Fuerte"][v]}</button>`).join("")}</div>`;parent.appendChild(w)}
SYM.forEach(x=>scale($("sym"),x,"s"));PAIN.forEach(x=>scale($("pain"),x,"p"));ACT.forEach((x,i)=>$("acts").insertAdjacentHTML("beforeend",`<label class=check><input id=a${i} type=checkbox>${x}</label>`));
document.querySelectorAll(".levels").forEach(g=>g.onclick=e=>{if(!e.target.classList.contains("lvl"))return;g.querySelectorAll(".lvl").forEach(b=>b.classList.remove("active"));e.target.classList.add("active")});
function today(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}$("fecha").value=today();
function db(){try{return JSON.parse(localStorage.getItem("diarioResfrios")||"{}")}catch{return {}}}function store(x){localStorage.setItem("diarioResfrios",JSON.stringify(x))}
function vals(k){let o={};document.querySelectorAll(`.levels[data-kind="${k}"]`).forEach(g=>o[g.dataset.name]=+g.querySelector(".active").dataset.v);return o}
function setv(k,n,v){let g=[...document.querySelectorAll(`.levels[data-kind="${k}"]`)].find(x=>x.dataset.name===n);if(g)g.querySelectorAll(".lvl").forEach(b=>b.classList.toggle("active",+b.dataset.v===+(v||0)))}
function form(){let s=vals("s"),p=vals("p");return {fecha:$("fecha").value,resfrio_declarado:$("resfrio_declarado").checked,sintomas_niveles:s,sintomas:Object.keys(s).filter(k=>s[k]>0),intensidad:+$("general").value,dolores_niveles:p,dolor_otro:$("otroDolor").value.trim(),actividades:ACT.filter((x,i)=>$("a"+i).checked),actividad_otro:$("otroAct").value.trim(),descanso:$("descanso").checked,siesta:$("siesta").checked,descanso_malestar:$("descanso_malestar").checked,frio:$("frio").checked,amgevita:$("amgevita").checked,exposicion:$("expo").value.trim(),medicinas:$("med").value.trim(),medico:$("doc").value.trim(),observaciones:$("obs").value.trim()}}
function load(f){let r=db()[f];$("fecha").value=f;$("resfrio_declarado").checked=!!r?.resfrio_declarado;SYM.forEach(n=>{let v=r?.sintomas_niveles?.[n];if(v===undefined)v=(r?.sintomas||[]).includes(n)?1:0;setv("s",n,v)});let old=r?.sintomas_niveles||{};PAIN.forEach(n=>{let v=r?.dolores_niveles?.[n];if(v===undefined)v=n==="Espalda"?(old["Dolor de espalda"]||0):n==="Sacroilíaco"?(old["Dolor sacroilíaco"]||0):n==="Cuádriceps"?(old["Dolor de pierna"]||0):0;setv("p",n,v)});$("general").value=r?.intensidad??0;$("otroDolor").value=r?.dolor_otro||"";ACT.forEach((n,i)=>$("a"+i).checked=(r?.actividades||[]).includes(n)||(n==="Surf"&&!!r?.surf));$("otroAct").value=r?.actividad_otro||"";$("descanso").checked=!!r?.descanso||(r?.actividades||[]).includes("Descanso");$("siesta").checked=!!r?.siesta;$("descanso_malestar").checked=!!r?.descanso_malestar;$("frio").checked=!!r?.frio;$("amgevita").checked=!!r?.amgevita;$("expo").value=r?.exposicion||"";$("med").value=r?.medicinas||"";$("doc").value=r?.medico||"";$("obs").value=r?.observaciones||""}
$("fecha").onchange=e=>load(e.target.value);$("save").onclick=()=>{let r=form(),d=db();d[r.fecha]=r;store(d);$("status").textContent="Guardado ✓";setTimeout(()=>$("status").textContent="",1500);render()};
function show(x){["R","C","D"].forEach(n=>$(n).classList.toggle("hidden",n!==x));[["tR","R"],["tC","C"],["tD","D"]].forEach(([b,n])=>$(b).classList.toggle("active",n===x));if(x==="C")render();if(x==="D")list()}
$("tR").onclick=()=>show("R");$("tC").onclick=()=>show("C");$("tD").onclick=()=>show("D");
function symptoms(r){return Object.entries(r?.sintomas_niveles||{}).some(([k,v])=>+v>0&&!["Dolor de espalda","Dolor sacroilíaco","Dolor de pierna"].includes(k))||(r?.sintomas||[]).some(k=>!["Dolor de espalda","Dolor sacroilíaco","Dolor de pierna"].includes(k))}function declared(r){return !!r?.resfrio_declarado}
function pain(r){return Object.values(r?.dolores_niveles||{}).some(v=>+v>0)||["Dolor de espalda","Dolor sacroilíaco","Dolor de pierna"].some(k=>+(r?.sintomas_niveles?.[k]||0)>0)}function activity(r){return (r?.actividades||[]).some(x=>x!=="Descanso")||!!(r?.actividad_otro||"").trim()}function rest(r){return !!r?.descanso||!!r?.siesta||!!r?.descanso_malestar||(r?.actividades||[]).includes("Descanso")}
const calFilters={declared:true,symptoms:true,pain:true,activity:true,rest:true,amgevita:true};
function filterOn(k){return calFilters[k]!==false}
function syncLegend(){document.querySelectorAll("#calLegend [data-filter]").forEach(el=>el.classList.toggle("off",!filterOn(el.dataset.filter)))}
document.addEventListener("click",e=>{let el=e.target.closest("#calLegend [data-filter]");if(!el)return;let k=el.dataset.filter;calFilters[k]=!filterOn(k);syncLegend();render()});
let cd=new Date();function render(){let y=cd.getFullYear(),m=cd.getMonth(),d=db();$("month").textContent=cd.toLocaleDateString("es-ES",{month:"long",year:"numeric"});let c=$("cal");[...c.querySelectorAll(".day")].forEach(e=>e.remove());let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){let e=document.createElement("div");e.className="day empty";c.appendChild(e)}for(let n=1;n<=days;n++){let iso=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,r=d[iso],dots=r?`${filterOn("declared")&&declared(r)?'<i class="dot coldbig"></i>':""}${filterOn("symptoms")&&symptoms(r)?'<i class="dot brown"></i>':""}${filterOn("pain")&&pain(r)?'<i class="dot orange"></i>':""}${filterOn("activity")&&activity(r)?'<i class="dot lightblue"></i>':""}${filterOn("rest")&&rest(r)?'<i class="dot yellow"></i>':""}${filterOn("amgevita")&&r.amgevita?'<i class="dot amggreen"></i>':""}`:"",e=document.createElement("button");e.className="day";e.innerHTML=`${n}<div class=dots>${dots}</div>`;e.onclick=()=>{load(iso);show("R")};c.appendChild(e)}}
$("prev").onclick=()=>{cd=new Date(cd.getFullYear(),cd.getMonth()-1,1);render()};$("next").onclick=()=>{cd=new Date(cd.getFullYear(),cd.getMonth()+1,1);render()};
function list(){let r=Object.values(db()).sort((a,b)=>b.fecha.localeCompare(a.fecha));$("list").innerHTML=r.length?r.map(x=>`<div class=entry><strong>${x.fecha}</strong><div class=small>${declared(x)?"Resfrío declarado ":""}${symptoms(x)?"· Síntomas ":""}${pain(x)?"· Dolor/lesión ":""}${activity(x)?"· Actividad ":""}${rest(x)?"· Descanso ":""}${x.amgevita?"· Amgevita":""}</div></div>`).join(""):"Sin registros"}
function esc(v){let s=Array.isArray(v)?v.join(" | "):String(v??"");return '"'+s.replaceAll('"','""')+'"'}$("export").onclick=()=>{let h=["fecha","resfrio_declarado","intensidad_general",...SYM,...PAIN,"dolor_otro","actividades","actividad_otro","descanso","siesta","descanso_por_resfrio_o_dolor","frio","amgevita","exposicion","medicinas","medico","observaciones"],rows=[h.map(esc).join(",")];Object.values(db()).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(r=>{let s=r.sintomas_niveles||{},p=r.dolores_niveles||{},v=[r.fecha,!!r.resfrio_declarado,r.intensidad??0,...SYM.map(k=>s[k]??((r.sintomas||[]).includes(k)?1:0)),...PAIN.map(k=>p[k]??0),r.dolor_otro||"",r.actividades||[],r.actividad_otro||"",rest(r),!!r.siesta,!!r.descanso_malestar,!!r.frio,!!r.amgevita,r.exposicion||"",r.medicinas||"",r.medico||"",r.observaciones||""];rows.push(v.map(esc).join(","))});let b=new Blob(["﻿"+rows.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="diario_resfrios_v3.csv";a.click()};load($("fecha").value);
</script></body></html>
