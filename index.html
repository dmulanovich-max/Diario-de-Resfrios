<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f4ef">
<link rel="manifest" href="manifest.json">
<title>Diario de Resfríos</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#2f2f2f;--muted:#777;--line:#ddd7cf;--accent:#b65f4d;--soft:#efe6df}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:rgba(247,244,239,.96);padding:18px 16px 10px;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:22px;margin:0 0 4px} .sub,.small,.desc{font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;padding-top:12px} nav button{flex:1;border:0;border-radius:12px;padding:10px;background:var(--soft);font-weight:600}
nav button.active{background:var(--accent);color:#fff}
main{padding:16px 16px 40px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.title{display:block;font-weight:700;margin-bottom:8px}
input[type=date],input[type=text],textarea,select{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{min-height:78px}
.sym{padding:11px 0;border-bottom:1px solid var(--line)} .sym:last-child{border-bottom:0}
.name{font-weight:600;margin-bottom:6px} .desc{margin-bottom:8px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.level{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:12px}
.level.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}
.check input{width:20px;height:20px}
.save,.secondary{width:100%;padding:13px;border-radius:13px;font-weight:700}
.save{border:0;background:var(--accent);color:#fff;font-size:17px} .secondary{border:1px solid var(--line);background:#fff}
.hidden{display:none} .status{text-align:center;margin-top:10px;color:var(--muted);font-size:13px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px} .dow,.day{text-align:center}
.dow{font-size:12px;color:var(--muted)} .day{min-height:48px;border-radius:12px;background:#fff;border:1px solid var(--line);padding:6px}
.day.empty{background:transparent;border-color:transparent} .day.has{border-color:var(--accent)} .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin:5px auto 0}
.episode{padding:10px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header>
<h1>Diario de Resfríos</h1>
<div class="sub">Síntomas, actividad y evolución diaria</div>
<nav><button id="tab-registro" class="active">Hoy</button><button id="tab-calendario">Calendario</button><button id="tab-datos">Datos</button></nav>
</header>
<main>
<section id="view-registro">
<div class="card"><label class="title">Fecha</label><input id="fecha" type="date"></div>
<div class="card"><label class="title">Síntomas</label><div class="small" style="margin-bottom:8px">0 Nada · 1 Leve · 2 Moderado · 3 Fuerte</div><div id="sintomas"></div></div>
<div class="card"><label class="title">Intensidad general</label><select id="intensidad">
<option value="0">0 — Sin síntomas</option><option value="1">1 — Muy leve</option><option value="2">2 — Leve</option><option value="3">3 — Moderado</option><option value="4">4 — Fuerte</option><option value="5">5 — Muy fuerte</option></select></div>
<div class="card"><label class="title">Actividad</label><div class="grid">
<label class="check"><input id="act_surf" type="checkbox">Surf</label>
<label class="check"><input id="act_natacion" type="checkbox">Natación</label>
<label class="check"><input id="act_caminata" type="checkbox">Caminata</label>
<label class="check"><input id="act_entrenamiento" type="checkbox">Entrenamiento</label>
<label class="check"><input id="act_fisio" type="checkbox">Fisioterapia</label>
<label class="check"><input id="act_descanso" type="checkbox">Descanso</label></div>
<div style="margin-top:10px"><input id="actividad_otro" type="text" placeholder="Otra actividad (opcional)"></div></div>
<div class="card"><label class="title">Circunstancias</label><div class="grid">
<label class="check"><input id="frio" type="checkbox">Frío / traje mojado</label>
<label class="check"><input id="amgevita" type="checkbox">Aplicación de Amgevita hoy</label></div></div>
<div class="card"><label class="title">Posible exposición</label><input id="exposicion" type="text" placeholder="Ej. reunión, mucha gente, viaje..."></div>
<div class="card"><label class="title">Medicinas</label><input id="medicinas" type="text" placeholder="Ej. Panadol, Allegra..."></div>
<div class="card"><label class="title">Médico</label><input id="medico" type="text" placeholder="Nombre o especialidad"></div>
<div class="card"><label class="title">Observaciones</label><textarea id="observaciones" placeholder="Cómo te sentiste, cambios, algo importante..."></textarea></div>
<button class="save" id="guardar">Guardar día</button><div class="status" id="estado"></div>
</section>
<section id="view-calendario" class="hidden"><div class="card"><div class="calendar-head"><button class="secondary" id="prev" style="width:auto">←</button><strong id="mesTitulo"></strong><button class="secondary" id="next" style="width:auto">→</button></div><div class="calendar" id="calendar"><div class="dow">L</div><div class="dow">M</div><div class="dow">X</div><div class="dow">J</div><div class="dow">V</div><div class="dow">S</div><div class="dow">D</div></div><p class="small">Los días con registro aparecen marcados. Toca uno para editarlo.</p></div></section>
<section id="view-datos" class="hidden"><div class="card"><label class="title">Exportar</label><p class="small">Descarga todos tus registros en CSV para abrirlos en Excel.</p><button class="secondary" id="exportar">Exportar CSV</button></div><div class="card"><label class="title">Registros guardados</label><div id="lista"></div></div></section>
</main>
<script>
const SINTOMAS=[{"k": "Dolor de cuerpo", "d": ""}, {"k": "Cansancio", "d": ""}, {"k": "Sueño", "d": ""}, {"k": "Dolor de cabeza", "d": "Dolor propiamente dicho."}, {"k": "Pesadez/congestión de cabeza", "d": "Sensación seca de presión o pesadez en nariz, ojos y oídos, sin dolor."}, {"k": "Congestión nasal", "d": "Nariz congestionada propiamente."}, {"k": "Dolor de oído", "d": ""}, {"k": "Mucosidad", "d": ""}, {"k": "Tos", "d": ""}, {"k": "Picazón de pecho", "d": ""}, {"k": "Dolor de garganta", "d": ""}, {"k": "Crujido bronquial", "d": ""}, {"k": "Sensación de frío", "d": ""}, {"k": "Fiebre", "d": ""}, {"k": "Molestias estomacales", "d": ""}, {"k": "Dolor de espalda", "d": ""}, {"k": "Dolor sacroilíaco", "d": ""}, {"k": "Dolor de pierna", "d": "Dolor particular que suele acompañar tus episodios."}];
const ACTIVIDADES=[["act_surf","Surf"],["act_natacion","Natación"],["act_caminata","Caminata"],["act_entrenamiento","Entrenamiento"],["act_fisio","Fisioterapia"],["act_descanso","Descanso"]];
const $=id=>document.getElementById(id);
SINTOMAS.forEach(s=>{
 let w=document.createElement("div"); w.className="sym";
 w.innerHTML=`<div class="name">${s.k}</div>${s.d?`<div class="desc">${s.d}</div>`:""}<div class="levels" data-symptom="${s.k}"><button type="button" class="level active" data-level="0">0 Nada</button><button type="button" class="level" data-level="1">1 Leve</button><button type="button" class="level" data-level="2">2 Moderado</button><button type="button" class="level" data-level="3">3 Fuerte</button></div>`;
 $("sintomas").appendChild(w);
});
document.querySelectorAll(".levels").forEach(g=>g.onclick=e=>{if(!e.target.classList.contains("level"))return;g.querySelectorAll(".level").forEach(b=>b.classList.remove("active"));e.target.classList.add("active")});
function hoyISO(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}
$("fecha").value=hoyISO();
function datos(){try{return JSON.parse(localStorage.getItem("diarioResfrios")||"{}")}catch(e){return {}}}
function saveDatos(d){localStorage.setItem("diarioResfrios",JSON.stringify(d))}
function niveles(){let o={};document.querySelectorAll(".levels").forEach(g=>o[g.dataset.symptom]=Number(g.querySelector(".active").dataset.level));return o}
function setNivel(n,v){let g=[...document.querySelectorAll(".levels")].find(x=>x.dataset.symptom===n);if(g)g.querySelectorAll(".level").forEach(b=>b.classList.toggle("active",Number(b.dataset.level)===Number(v||0)))}
function leer(){
 let n=niveles(), acts=ACTIVIDADES.filter(([id])=>$(id).checked).map(([,n])=>n);
 return {fecha:$("fecha").value,sintomas_niveles:n,sintomas:Object.entries(n).filter(([,v])=>v>0).map(([k])=>k),intensidad:Number($("intensidad").value),actividades:acts,actividad_otro:$("actividad_otro").value.trim(),frio:$("frio").checked,amgevita:$("amgevita").checked,exposicion:$("exposicion").value.trim(),medicinas:$("medicinas").value.trim(),medico:$("medico").value.trim(),observaciones:$("observaciones").value.trim()};
}
function cargar(f){
 let d=datos()[f]; $("fecha").value=f;
 SINTOMAS.forEach(s=>{let v=d?.sintomas_niveles?.[s.k]; if(v===undefined)v=(d?.sintomas||[]).includes(s.k)?1:0; setNivel(s.k,v)});
 $("intensidad").value=d?.intensidad??0;
 ACTIVIDADES.forEach(([id,n])=>$(id).checked=(d?.actividades||[]).includes(n)||(n==="Surf"&&!!d?.surf));
 $("actividad_otro").value=d?.actividad_otro||""; $("frio").checked=!!d?.frio; $("amgevita").checked=!!d?.amgevita;
 $("exposicion").value=d?.exposicion||"";$("medicinas").value=d?.medicinas||"";$("medico").value=d?.medico||"";$("observaciones").value=d?.observaciones||"";
}
$("fecha").onchange=e=>cargar(e.target.value);
$("guardar").onclick=()=>{let r=leer(),d=datos();d[r.fecha]=r;saveDatos(d);$("estado").textContent="Guardado ✓";setTimeout(()=>$("estado").textContent="",1800);renderCal();renderLista()};
function show(n){["registro","calendario","datos"].forEach(x=>{$("view-"+x).classList.toggle("hidden",x!==n);$("tab-"+x).classList.toggle("active",x===n)});if(n==="calendario")renderCal();if(n==="datos")renderLista()}
$("tab-registro").onclick=()=>show("registro");$("tab-calendario").onclick=()=>show("calendario");$("tab-datos").onclick=()=>show("datos");
let calDate=new Date();
function renderCal(){
 let y=calDate.getFullYear(),m=calDate.getMonth();$("mesTitulo").textContent=calDate.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
 let c=$("calendar");[...c.querySelectorAll(".day")].forEach(x=>x.remove());let first=(new Date(y,m,1).getDay()+6)%7,ds=new Date(y,m+1,0).getDate(),d=datos();
 for(let i=0;i<first;i++){let e=document.createElement("div");e.className="day empty";c.appendChild(e)}
 for(let n=1;n<=ds;n++){let iso=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,e=document.createElement("button");e.className="day"+(d[iso]?" has":"");e.innerHTML=`${n}${d[iso]?'<div class="dot"></div>':""}`;e.onclick=()=>{cargar(iso);show("registro")};c.appendChild(e)}
}
$("prev").onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCal()};$("next").onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCal()};
function esc(v){let s=Array.isArray(v)?v.join(" | "):String(v??"");return '"'+s.replaceAll('"','""')+'"'}
$("exportar").onclick=()=>{let rows=Object.values(datos()).sort((a,b)=>a.fecha.localeCompare(b.fecha)),sh=SINTOMAS.map(s=>s.k),h=["fecha","intensidad_general",...sh,"actividades","actividad_otro","frio_traje_mojado","amgevita","exposicion","medicinas","medico","observaciones"],out=[h.map(esc).join(",")];
 rows.forEach(r=>{let n=r.sintomas_niveles||{},vals=[r.fecha,r.intensidad??0,...sh.map(s=>n[s]??((r.sintomas||[]).includes(s)?1:0)),r.actividades||((r.surf)?["Surf"]:[]),r.actividad_otro||"",!!r.frio,!!r.amgevita,r.exposicion||"",r.medicinas||"",r.medico||"",r.observaciones||""];out.push(vals.map(esc).join(","))});
 let blob=new Blob(["\ufeff"+out.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="diario_resfrios_v2.csv";a.click();
};
function renderLista(){let r=Object.values(datos()).sort((a,b)=>b.fecha.localeCompare(a.fecha));$("lista").innerHTML=r.length?r.map(x=>`<div class="episode"><strong>${x.fecha}</strong> · Intensidad general ${x.intensidad??0}<div class="small">${(x.sintomas||[]).join(", ")||"Sin síntomas marcados"}${x.amgevita?" · Amgevita":""}</div></div>`).join(""):'<div class="small">Todavía no hay registros.</div>'}
cargar($("fecha").value);
</script>
</body>
</html>
