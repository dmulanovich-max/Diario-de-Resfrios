<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=apple-mobile-web-app-capable content=yes><link rel=manifest href=manifest.json><title>Diario de Resfríos</title><style>
:root{--bg:#f7f4ef;--line:#ddd7cf;--accent:#b65f4d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#303030}header{position:sticky;top:0;background:#f7f4eff5;padding:18px 16px 10px;border-bottom:1px solid var(--line);z-index:3}h1{font-size:22px;margin:0}.sub,.small{font-size:12px;color:#777}nav{display:flex;gap:8px;margin-top:12px}nav button{flex:1;border:0;border-radius:12px;padding:10px;background:#efe6df;font-weight:600}nav .active{background:var(--accent);color:white}main{padding:16px;max-width:760px;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.title{display:block;font-weight:700;margin-bottom:8px}input[type=date],input[type=text],textarea,select{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.item{padding:11px 0;border-bottom:1px solid var(--line)}.name{font-weight:600;margin-bottom:7px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.lvl{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 2px;font-size:12px}.lvl.active{background:var(--accent);color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:11px}.check input{width:20px;height:20px}.save,.secondary{width:100%;padding:13px;border-radius:13px;font-weight:700}.save{border:0;background:var(--accent);color:white;font-size:17px}.secondary{border:1px solid var(--line);background:white}.hidden{display:none}.calendar-head{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.dow,.day{text-align:center}.dow{font-size:12px;color:#777}.day{min-height:52px;border:1px solid var(--line);border-radius:12px;background:white;padding:6px}.empty{visibility:hidden}.dots{display:flex;justify-content:center;gap:3px;margin-top:6px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.brown{background:#805b45}.blue{background:#2877c7}.red{background:#c63e3e}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px}.legend span{display:flex;gap:5px;align-items:center}.status{text-align:center;color:#777;margin-top:8px;font-size:13px}.entry{padding:9px 0;border-bottom:1px solid var(--line)}
</style></head><body><header><h1>Diario de Resfríos</h1><div class=sub>Síntomas, Amgevita, actividad y dolores · v2.1.1</div><nav><button id=tR class=active>Hoy</button><button id=tC>Calendario</button><button id=tD>Datos</button></nav></header><main>
<section id=R><div class=card><label class=title>Fecha</label><input id=fecha type=date></div><div class=card><label class=title>Síntomas de resfrío</label><div class=small>0 Nada · 1 Leve · 2 Moderado · 3 Fuerte</div><div id=sym></div></div><div class=card><label class=title>Intensidad general</label><select id=general><option value=0>0 — Sin síntomas</option><option value=1>1 — Muy leve</option><option value=2>2 — Leve</option><option value=3>3 — Moderado</option><option value=4>4 — Fuerte</option><option value=5>5 — Muy fuerte</option></select></div>
<div class=card><label class=title>Dolores / lesiones</label><div class=small>Separados de los síntomas de resfrío.</div><div id=pain></div><input id=otroDolor type=text placeholder="Si marcaste Otro, escribe cuál"></div>
<div class=card><label class=title>Actividad</label><div class=grid id=acts></div><input id=otroAct type=text placeholder="Otra actividad (opcional)" style="margin-top:9px"></div>
<div class=card><label class=title>Circunstancias</label><div class=grid><label class=check><input id=frio type=checkbox>Frío / traje mojado</label><label class=check><input id=amgevita type=checkbox>Aplicación de Amgevita hoy</label></div></div>
<div class=card><label class=title>Posible exposición</label><input id=expo type=text placeholder="Ej. reunión, mucha gente, viaje..."></div><div class=card><label class=title>Medicinas</label><input id=med type=text></div><div class=card><label class=title>Médico</label><input id=doc type=text></div><div class=card><label class=title>Observaciones</label><textarea id=obs></textarea></div><button id=save class=save>Guardar día</button><div id=status class=status></div></section>
<section id=C class=hidden><div class=card><div class=calendar-head><button id=prev class=secondary style="width:auto">←</button><strong id=month></strong><button id=next class=secondary style="width:auto">→</button></div><div id=cal class=calendar><div class=dow>L</div><div class=dow>M</div><div class=dow>X</div><div class=dow>J</div><div class=dow>V</div><div class=dow>S</div><div class=dow>D</div></div><div class=legend><span><i class="dot brown"></i>Resfrío</span><span><i class="dot blue"></i>Amgevita</span><span><i class="dot red"></i>Dolor / lesión</span></div><p class=small>Un día puede mostrar los tres puntos. Toca un día para abrirlo.</p></div></section>
<section id=D class=hidden><div class=card><label class=title>Exportar</label><button id=export class=secondary>Exportar CSV</button></div><div class=card><label class=title>Registros guardados</label><div id=list></div></div></section></main><script>
const SYM=["Dolor de cuerpo", "Cansancio", "Sueño", "Dolor de cabeza", "Pesadez/congestión de cabeza", "Congestión nasal", "Dolor de oído", "Mucosidad", "Tos", "Picazón de pecho", "Dolor de garganta", "Crujido bronquial", "Sensación de frío", "Fiebre", "Molestias estomacales"],PAIN=["Cuádriceps", "Sacroilíaco", "Espalda", "Hombro", "Otro"],ACT=["Surf","Natación","Caminata","Entrenamiento","Fisioterapia","Descanso"],$=x=>document.getElementById(x);
function scale(parent,n,kind){let w=document.createElement("div");w.className="item";w.innerHTML=`<div class=name>${n}</div><div class=levels data-kind="${kind}" data-name="${n}">${[0,1,2,3].map((v,i)=>`<button type=button class="lvl ${i?"":"active"}" data-v=${v}>${v} ${["Nada","Leve","Moderado","Fuerte"][v]}</button>`).join("")}</div>`;parent.appendChild(w)}
SYM.forEach(x=>scale($("sym"),x,"s"));PAIN.forEach(x=>scale($("pain"),x,"p"));ACT.forEach((x,i)=>$("acts").insertAdjacentHTML("beforeend",`<label class=check><input id=a${i} type=checkbox>${x}</label>`));
document.querySelectorAll(".levels").forEach(g=>g.onclick=e=>{if(!e.target.classList.contains("lvl"))return;g.querySelectorAll(".lvl").forEach(b=>b.classList.remove("active"));e.target.classList.add("active")});
function today(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}$("fecha").value=today();
function db(){try{return JSON.parse(localStorage.getItem("diarioResfrios")||"{}")}catch{return {}}}function store(x){localStorage.setItem("diarioResfrios",JSON.stringify(x))}
function vals(k){let o={};document.querySelectorAll(`.levels[data-kind="${k}"]`).forEach(g=>o[g.dataset.name]=+g.querySelector(".active").dataset.v);return o}
function setv(k,n,v){let g=[...document.querySelectorAll(`.levels[data-kind="${k}"]`)].find(x=>x.dataset.name===n);if(g)g.querySelectorAll(".lvl").forEach(b=>b.classList.toggle("active",+b.dataset.v===+(v||0)))}
function form(){let s=vals("s"),p=vals("p");return {fecha:$("fecha").value,sintomas_niveles:s,sintomas:Object.keys(s).filter(k=>s[k]>0),intensidad:+$("general").value,dolores_niveles:p,dolor_otro:$("otroDolor").value.trim(),actividades:ACT.filter((x,i)=>$("a"+i).checked),actividad_otro:$("otroAct").value.trim(),frio:$("frio").checked,amgevita:$("amgevita").checked,exposicion:$("expo").value.trim(),medicinas:$("med").value.trim(),medico:$("doc").value.trim(),observaciones:$("obs").value.trim()}}
function load(f){let r=db()[f];$("fecha").value=f;SYM.forEach(n=>{let v=r?.sintomas_niveles?.[n];if(v===undefined)v=(r?.sintomas||[]).includes(n)?1:0;setv("s",n,v)});let old=r?.sintomas_niveles||{};PAIN.forEach(n=>{let v=r?.dolores_niveles?.[n];if(v===undefined)v=n==="Espalda"?(old["Dolor de espalda"]??((r?.sintomas||[]).includes("Dolor de espalda")?1:0)):n==="Sacroilíaco"?(old["Dolor sacroilíaco"]??((r?.sintomas||[]).includes("Dolor sacroilíaco")?1:0)):n==="Cuádriceps"?(old["Dolor de pierna"]??((r?.sintomas||[]).includes("Dolor de pierna")?1:0)):0;setv("p",n,v)});$("general").value=r?.intensidad??0;$("otroDolor").value=r?.dolor_otro||"";ACT.forEach((n,i)=>$("a"+i).checked=(r?.actividades||[]).includes(n)||(n==="Surf"&&!!r?.surf));$("otroAct").value=r?.actividad_otro||"";$("frio").checked=!!r?.frio;$("amgevita").checked=!!r?.amgevita;$("expo").value=r?.exposicion||"";$("med").value=r?.medicinas||"";$("doc").value=r?.medico||"";$("obs").value=r?.observaciones||""}
$("fecha").onchange=e=>load(e.target.value);$("save").onclick=()=>{let r=form(),d=db();d[r.fecha]={...(d[r.fecha]||{}),...r};store(d);$("status").textContent="Guardado ✓";setTimeout(()=>$("status").textContent="",1500);renderCalendar()};
function show(x){["R","C","D"].forEach(n=>$(n).classList.toggle("hidden",n!==x));[["tR","R"],["tC","C"],["tD","D"]].forEach(([b,n])=>$(b).classList.toggle("active",n===x));if(x==="C")renderCalendar();if(x==="D")renderList()}
$("tR").onclick=()=>show("R");$("tC").onclick=()=>show("C");$("tD").onclick=()=>show("D");
function hasCold(r){return Object.entries(r?.sintomas_niveles||{}).some(([k,v])=>+v>0&&!["Dolor de espalda","Dolor sacroilíaco","Dolor de pierna"].includes(k))||(r?.sintomas||[]).some(k=>!["Dolor de espalda","Dolor sacroilíaco","Dolor de pierna"].includes(k))}
function hasPain(r){return Object.values(r?.dolores_niveles||{}).some(v=>+v>0)||["Dolor de espalda","Dolor sacroilíaco","Dolor de pierna"].some(k=>+(r?.sintomas_niveles?.[k]||0)>0)}
let cd=new Date();function renderCalendar(){let y=cd.getFullYear(),m=cd.getMonth(),d=db();$("month").textContent=cd.toLocaleDateString("es-ES",{month:"long",year:"numeric"});let c=$("cal");[...c.querySelectorAll(".day")].forEach(e=>e.remove());let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){let e=document.createElement("div");e.className="day empty";c.appendChild(e)}for(let n=1;n<=days;n++){let iso=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,r=d[iso],dots=r?`${hasCold(r)?'<i class="dot brown"></i>':""}${r.amgevita?'<i class="dot blue"></i>':""}${hasPain(r)?'<i class="dot red"></i>':""}`:"",e=document.createElement("button");e.className="day";e.innerHTML=`${n}<div class=dots>${dots}</div>`;e.onclick=()=>{load(iso);show("R")};c.appendChild(e)}}
$("prev").onclick=()=>{cd=new Date(cd.getFullYear(),cd.getMonth()-1,1);renderCalendar()};$("next").onclick=()=>{cd=new Date(cd.getFullYear(),cd.getMonth()+1,1);renderCalendar()};
function renderList(){let r=Object.values(db()).sort((a,b)=>b.fecha.localeCompare(a.fecha));$("list").innerHTML=r.length?r.map(x=>`<div class=entry><strong>${x.fecha}</strong><div class=small>${cold(x)?"Resfrío ":""}${x.amgevita?"· Amgevita ":""}${pain(x)?"· Dolor/lesión":""}</div></div>`).join(""):"Sin registros"}
function esc(v){let s=Array.isArray(v)?v.join(" | "):String(v??"");return '"'+s.replaceAll('"','""')+'"'}$("export").onclick=()=>{let h=["fecha","intensidad_general",...SYM,...PAIN,"dolor_otro","actividades","actividad_otro","frio","amgevita","exposicion","medicinas","medico","observaciones"],rows=[h.map(esc).join(",")];Object.values(db()).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(r=>{let s=r.sintomas_niveles||{},p=r.dolores_niveles||{},v=[r.fecha,r.intensidad??0,...SYM.map(k=>s[k]??((r.sintomas||[]).includes(k)?1:0)),...PAIN.map(k=>p[k]??0),r.dolor_otro||"",r.actividades||[],r.actividad_otro||"",!!r.frio,!!r.amgevita,r.exposicion||"",r.medicinas||"",r.medico||"",r.observaciones||""];rows.push(v.map(esc).join(","))});let b=new Blob(["﻿"+rows.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="diario_resfrios_v2_1.csv";a.click()};load($("fecha").value);
</script></body></html>
